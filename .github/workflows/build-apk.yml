name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps --force
          npm install react-is tslib --legacy-peer-deps --force
          echo "export const registerSW = () => () => {}; export const useRegisterSW = () => ({ needRefresh: [false, () => {}], offlineReady: [false, () => {}], updateServiceWorker: () => {} });" > src/pwa-mock.ts
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';

          export default defineConfig({
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: {
                'virtual:pwa-register': '/src/pwa-mock.ts',
                'virtual:pwa-register/react': '/src/pwa-mock.ts'
              }
            }
          });
          EOF
          npm run build

      - name: Setup Fresh Capacitor Android
        run: |
          mkdir -p backup_res
          cp -r android/app/src/main/res/* backup_res/ 2>/dev/null || true
          rm -rf android
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "Sonance" "com.sonance.music" --web-dir=dist
          fi
          npx cap add android
          cp -rn backup_res/* android/app/src/main/res/ 2>/dev/null || true
          if [ -f "android/app/src/main/res/values/strings.xml" ] && ! grep -q "sonance_widget_description" android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|    <string name="sonance_widget_description">Sonance Music Player Widget</string>\n</resources>|g' android/app/src/main/res/values/strings.xml
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain | tail -n 50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
