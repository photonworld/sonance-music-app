name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Soulwave Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Capacitor 8 (@capacitor/android & v8 plugins) compiles with JavaVersion.VERSION_21
      - name: Set up Java 21 for Capacitor 8 Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add and sync Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            if [ -d "android/app/src" ]; then
              mkdir -p /tmp/android-src-backup
              cp -a android/app/src /tmp/android-src-backup/src
              rm -rf android
              npx cap add android
              cp -a /tmp/android-src-backup/src/. android/app/src/
              rm -rf /tmp/android-src-backup
            else
              rm -rf android
              npx cap add android
            fi
          fi
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulwave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
