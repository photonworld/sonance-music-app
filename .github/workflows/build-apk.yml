name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps --force
          npm install react-is tslib --legacy-peer-deps --force
          echo "export const registerSW = () => () => {}; export const useRegisterSW = () => ({ needRefresh: [false, () => {}], offlineReady: [false, () => {}], updateServiceWorker: () => {} });" > src/pwa-mock.ts
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';

          export default defineConfig({
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: {
                'virtual:pwa-register': '/src/pwa-mock.ts',
                'virtual:pwa-register/react': '/src/pwa-mock.ts'
              }
            }
          });
          EOF
          npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            mkdir -p temp_android
            cp -r android/* temp_android/ 2>/dev/null || true
            rm -rf android
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
            npx cap init "Sonance" "com.sonance.music" --web-dir=dist
            npx cap add android
            cp -rn temp_android/* android/ 2>/dev/null || true
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
